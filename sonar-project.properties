# SonarCloud Configuration - Consorcio Pillco Marca
# El token NO se guarda aquí: se pasa por la variable de entorno SONAR_TOKEN.
sonar.host.url=https://sonarcloud.io
sonar.organization=consorcio-pillco-marca
sonar.projectKey=consorcio-pillco-marca_version-2
sonar.projectName=Consorcio Pillco Marca v2
sonar.projectVersion=3.2.0

# Source Directories (must stay disjoint from sonar.tests)
sonar.sources=app,resources/js/components,resources/js/design-system,resources/js/hooks,resources/js/pages,resources/js/services,resources/js/types,resources/js/utils,resources/js/app.tsx,resources/js/navigation.config.ts
sonar.tests=tests,resources/js/tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/build/**,bootstrap/ssr/**,storage/**,coverage/**,cypress/screenshots/**,cypress/videos/**,resources/js/actions/**,resources/js/routes/**,resources/js/wayfinder/**,**/*.min.js
sonar.cpd.exclusions=resources/js/actions/**,resources/js/routes/**,resources/js/wayfinder/**,resources/js/components/icons/**,resources/js/components/ui.tsx

# Reports
sonar.php.tests.reportPath=phpunit-report.xml
sonar.php.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate Standard
sonar.qualitygate.wait=false
