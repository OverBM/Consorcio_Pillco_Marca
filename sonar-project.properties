# SonarQube / SonarCloud Configuration - Consorcio Pillco Marca
sonar.projectKey=consorcio-pillco-marca_version-2
sonar.projectVersion=3.0.0

# Source Directories (must stay disjoint from sonar.tests)
sonar.sources=app,resources/js/components,resources/js/design-system,resources/js/hooks,resources/js/pages,resources/js/services,resources/js/types,resources/js/utils,resources/js/app.tsx,resources/js/navigation.config.ts
sonar.tests=tests,resources/js/tests
sonar.sourceEncoding=UTF-8

# Reports
sonar.php.tests.reportPath=phpunit-report.xml
sonar.php.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate Standard
sonar.qualitygate.wait=false
