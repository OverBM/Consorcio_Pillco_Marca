# SonarQube Configuration - Consorcio Pillco Marca
sonar.organization=consorcio-pillco-marca
sonar.projectKey=consorcio-pillco-marca_version-1
sonar.projectVersion=3.0.0

# Source Directories
sonar.sources=app,resources/js
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,database/migrations/**
sonar.coverage.exclusions=**/*Test.php,resources/js/types/**,resources/js/components/icons/**

# PHP Coverage & Execution Reports sonar.php.coverage.reportPaths=coverage.xml sonar.php.tests.reportPath=phpunit-report.xml

# Quality Gate Standard
sonar.qualitygate.wait=false
